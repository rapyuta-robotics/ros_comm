# =============================================================================
# GitHub Actions: Patch libroscpp.so in an existing Docker image
#
# Manually triggered workflow that:
#   1. Pulls the patched libroscpp.so from an already-built source image
#   2. Injects it into the user-specified Docker image
#   3. Pushes the patched image back (with the same or custom tag)
#
# No recompilation — just a two-layer Docker build (~seconds, not minutes).
#
# Usage: Go to Actions → "Patch Image (libroscpp)" → Run workflow
# =============================================================================

name: Patch Image (libroscpp)

on:
  workflow_dispatch:
    inputs:
      target_image:
        description: 'Full image name with tag to patch (e.g. quay.io/rapyuta/ros:noetic-abc)'
        required: true
        type: string
      patch_source_image:
        description: 'Image containing patched libroscpp.so. Leave empty to auto-detect (noetic-patched from rr-devel, or noetic-pr-<N> from a PR build).'
        required: false
        type: string
        default: ''
      output_tag:
        description: 'Output tag. Leave empty to overwrite the original tag.'
        required: false
        type: string
        default: ''
      platforms:
        description: 'Target platforms (comma-separated)'
        required: false
        type: string
        default: 'linux/amd64,linux/arm64'

env:
  REGISTRY: quay.io
  IMAGE_NAME: rapyuta/ros

jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU (for multi-arch builds)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Quay.io
        uses: docker/login-action@v3
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USER }}
          password: ${{ secrets.QUAY_PASS }}

      - name: Determine patch source and output image
        id: resolve
        run: |
          TARGET="${{ inputs.target_image }}"
          SOURCE="${{ inputs.patch_source_image }}"
          SUFFIX="${{ inputs.output_tag }}"

          # --- Resolve patch source image ---
          if [ -z "${SOURCE}" ]; then
            # Auto-detect: use noetic-patched (built from rr-devel)
            SOURCE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:noetic-patched"
            echo "ℹ️  No patch source specified, using default: ${SOURCE}"
          fi

          # --- Resolve output tag ---
          if [ -n "${SUFFIX}" ]; then
            REPO="${TARGET%%:*}"
            OUTPUT="${REPO}:${SUFFIX}"
          else
            OUTPUT="${TARGET}"
          fi

          echo "source=${SOURCE}" >> "$GITHUB_OUTPUT"
          echo "output=${OUTPUT}" >> "$GITHUB_OUTPUT"

          echo "🔧 Patch source:  ${SOURCE}"
          echo "🎯 Target image:  ${TARGET}"
          echo "📦 Output image:  ${OUTPUT}"

      - name: Build and push patched image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.patch-image
          platforms: ${{ inputs.platforms }}
          build-args: |
            PATCH_SOURCE_IMAGE=${{ steps.resolve.outputs.source }}
            TARGET_IMAGE=${{ inputs.target_image }}
            ROS_DISTRO=noetic
          push: true
          tags: ${{ steps.resolve.outputs.output }}

      - name: Summary
        run: |
          echo "## ✅ Image Patched Successfully" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| | |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Patch source** | \`${{ steps.resolve.outputs.source }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Target image** | \`${{ inputs.target_image }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Output image** | \`${{ steps.resolve.outputs.output }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Platforms** | \`${{ inputs.platforms }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Patched lib** | \`libroscpp.so\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Pull with:" >> "$GITHUB_STEP_SUMMARY"
          echo "\`\`\`" >> "$GITHUB_STEP_SUMMARY"
          echo "docker pull ${{ steps.resolve.outputs.output }}" >> "$GITHUB_STEP_SUMMARY"
          echo "\`\`\`" >> "$GITHUB_STEP_SUMMARY"
